# Anime Manager's uosc settings (uosc 5.13.0). Anything not set here uses uosc's defaults.
# Previous/next follow the app's order (episodes, related seasons, queue), so they
# send messages to the app instead of using mpv's playlist.
controls=menu,gap,subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,gap,space,speed,space,command:skip_previous:script-message catalog previous?Previous episode,command:skip_next:script-message catalog next?Next episode,gap,command:picture_in_picture_alt:script-message catalog pip?Picture in picture,fullscreen
controls_size=30
timeline_style=line
timeline_line_width=3
timeline_size=36
progress=windowed
progress_size=3
top_bar=no-border
top_bar_controls=no
top_bar_title=yes
# Night-blue panel with the app's ridge-blue accent, matching src/design/theme.ts.
color=foreground=86b8dc,foreground_text=0a131d,background=0a131d,background_text=d6dadf,curtain=060c14,success=a3c4af,error=e39e98
border_radius=6
font_bold=yes
autoload=no
destination_time=total
time_precision=0
proximity_in=40
proximity_out=120
